<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css">

  <title>Dashboard — Viagens Médicas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

  <main class="app" id="main-content"></main>

  <script>
    const trips = [
      {
        id: 1,
        origin: "Origem Y",
        destination: "Destino X",
        driver: "João Silva",
        vehicle: "Van Mercedes",
        plate: "38409384",
        patients: 13,
        timeStart: "07:00",
        timeEnd: "15:00",
        progress: 50,
        status: "Aguardando retorno à Origem..."
      },
      {
        id: 2,
        origin: "Origem A",
        destination: "Destino B",
        driver: "Maria Souza",
        vehicle: "Sprinter Ford",
        plate: "59201847",
        patients: 8,
        timeStart: "08:30",
        timeEnd: "14:00",
        progress: 25,
        status: "Em trânsito para Destino B..."
      }
    ];

    function TravelCard(trip) {
      return `
        <div class="travel-card">
          <div class="travel-card-title">
            <div class="route-icon">
              <i
                data-lucide="triangle-alert"
                width="18"
                height="18"
                aria-hidden="true"
              ></i>
            </div>

            ${trip.origin} → ${trip.destination}
          </div>

          <div class="travel-info-row">
            <i
              data-lucide="car"
              width="16"
              height="16"
              aria-hidden="true"
            ></i>

            <span>
              ${trip.driver} - ${trip.vehicle} • ${trip.plate}
            </span>
          </div>

          <div class="travel-info-row">
            <i
              data-lucide="users"
              width="16"
              height="16"
              aria-hidden="true"
            ></i>

            <span>${trip.patients} pacientes</span>
          </div>

          <div class="travel-info-row">
            <i
              data-lucide="clock"
              width="16"
              height="16"
              aria-hidden="true"
            ></i>

            <span>${trip.timeStart} - ${trip.timeEnd}</span>
          </div>

          <div class="progress-wrapper">
            <div class="progress-header">
              ${trip.progress}%
            </div>

            <div
              class="progress-bar-bg"
              aria-label="Progresso da viagem"
            >
              <div
                class="progress-bar-fill"
                style="width: ${trip.progress}%"
              ></div>
            </div>

            <div class="progress-label">
              ${trip.status}
            </div>
          </div>

          <button
            class="btn-details"
            aria-label="Ver detalhes da viagem de ${trip.origin} para ${trip.destination}"
          >
            Detalhes
          </button>
        </div>
      `;
    }

    function render() {
      const tripsHTML = trips.map(TravelCard).join('');

      document.getElementById('main-content').innerHTML = `
        <header class="header">
          <h1>Dashboard</h1>

          <p class="subtitle">
            Bem-vindo de volta, Nome do Motorista!
          </p>

          <button
            class="today-btn"
            aria-label="Selecionar data"
          >
            Hoje

            <i
              data-lucide="chevron-down"
              width="14"
              height="14"
              aria-hidden="true"
            ></i>
          </button>
        </header>

        <section
          class="summary-card"
          aria-label="Resumo das viagens"
        >
          <span class="badge">+2</span>

          <div class="summary-icon">
            <i
              data-lucide="bus"
              width="22"
              height="22"
              aria-hidden="true"
            ></i>
          </div>

          <div class="summary-label">
            Viagens Realizadas
          </div>

          <div class="summary-number">
            4
          </div>
        </section>

        <section aria-labelledby="trips-title">
          <h2
            id="trips-title"
            class="section-title"
          >
            Viagens para hoje
          </h2>

          <div class="section-desc">
            Abaixo você pode visualizar os detalhes das viagens criadas para o dia de hoje.
          </div>

          ${tripsHTML}
        </section>
      `;

      lucide.createIcons();
    }

    render();
  </script>
</body>
</html>
