<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Viagens Médicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

  <div class="font-size-controls" role="group" aria-label="Controles de tamanho de fonte">
    <button
      class="font-size-btn"
      id="font-decrease"
      aria-label="Diminuir tamanho da fonte"
    >A−</button>
    <button
      class="font-size-btn"
      id="font-increase"
      aria-label="Aumentar tamanho da fonte"
    >A+</button>
  </div>

  <button
    class="contrast-btn"
    id="contrast-btn"
    aria-label="Ativar alto contraste"
    aria-pressed="false"
  >
    <i data-lucide="sun" width="20" height="20" aria-hidden="true"></i>
  </button>

  <main class="app" id="main-content" tabindex="-1"></main>

  <script>
    const trips = [
      {
        id: 1,
        origin: "Origem Y",
        destination: "Destino X",
        driver: "João Silva",
        vehicle: "Van Mercedes",
        plate: "38409384",
        patients: 13,
        timeStart: "07:00",
        timeEnd: "15:00",
        progress: 50,
        status: "Aguardando retorno à Origem...",
      },
      {
        id: 2,
        origin: "Origem A",
        destination: "Destino B",
        driver: "João Silva",
        vehicle: "Sprinter Ford",
        plate: "59201847",
        patients: 8,
        timeStart: "16:00",
        timeEnd: "22:00",
        progress: 25,
        status: "Em trânsito para Destino B...",
      },
    ];

    function TravelCard(trip) {
      return `
        <article class="travel-card" aria-label="Viagem de ${trip.origin} para ${trip.destination}">
          <div class="travel-card-title">
            <div class="route-icon" aria-hidden="true">
              <canvas id="wheel-canvas-3d-${trip.id}" class="wheel-canvas-3d" width="38" height="38"></canvas>
            </div>
            ${trip.origin} → ${trip.destination}
          </div>

          <div class="travel-info-row">
            <canvas id="car-canvas-3d-${trip.id}" class="car-canvas-3d" width="16" height="16" aria-hidden="true"></canvas>
            <span>${trip.driver} - ${trip.vehicle} • ${trip.plate}</span>
          </div>

          <div class="travel-info-row">
            <i data-lucide="users" width="16" height="16" aria-hidden="true"></i>
            <span>${trip.patients} pacientes</span>
          </div>

          <div class="travel-info-row">
            <i data-lucide="clock" width="16" height="16" aria-hidden="true"></i>
            <span>${trip.timeStart} - ${trip.timeEnd}</span>
          </div>

          <div class="progress-wrapper">
            <div class="progress-header" aria-hidden="true">${trip.progress}%</div>
            <div
              class="progress-bar-bg"
              role="progressbar"
              aria-valuenow="${trip.progress}"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-label="Progresso da viagem: ${trip.progress}%"
            >
              <div class="progress-bar-fill" style="width: ${trip.progress}%"></div>
            </div>
            <div class="progress-label" aria-live="polite">${trip.status}</div>
          </div>

          <button
            class="btn-details"
            aria-label="Ver detalhes da viagem de ${trip.origin} para ${trip.destination}"
          >
            Detalhes
          </button>
        </article>
      `;
    }

    function render() {
      const tripsHTML = trips.map(TravelCard).join('');

      document.getElementById('main-content').innerHTML = `
        <header class="header">
          <h1>Dashboard</h1>
          <p class="subtitle">Bem-vindo de volta, Nome do Motorista!</p>
          <button class="today-btn" aria-label="Selecionar data de hoje">
            Hoje <i data-lucide="chevron-down" width="14" height="14" aria-hidden="true"></i>
          </button>
        </header>

        <section class="summary-card" aria-label="Resumo: 4 viagens realizadas">
          <span class="badge" aria-hidden="true">+2</span>
          <div class="summary-icon" aria-hidden="true">
            <i data-lucide="bus" width="22" height="22"></i>
          </div>
          <div class="summary-label" aria-hidden="true">Viagens Realizadas</div>
          <div class="summary-number" aria-hidden="true">4</div>
        </section>

        <section aria-labelledby="trips-title">
          <h2 id="trips-title" class="section-title">Viagens para hoje</h2>
          <p class="section-desc">
            Abaixo você pode visualizar os detalhes das viagens criadas para o dia de hoje!
          </p>
          ${tripsHTML}
        </section>
      `;

      lucide.createIcons();
    }

    render();

    async function initCarModel() {
      const canvases = document.querySelectorAll('.car-canvas-3d');
      if (!canvases.length) return;

      const { WebGLRenderer, Scene, PerspectiveCamera, AmbientLight, DirectionalLight, Box3, Vector3 } = await import('three');
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');

      const loader = new GLTFLoader();

      canvases.forEach((canvas) => {
        const renderer = new WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(32, 32);

        const scene = new Scene();
        const camera = new PerspectiveCamera(45, 1, 0.1, 100);
        camera.position.set(0, 1.2, 3);
        camera.lookAt(0, 0.2, 0);

        scene.add(new AmbientLight(0xffffff, 1.2));
        const dir = new DirectionalLight(0xffffff, 1.5);
        dir.position.set(3, 5, 3);
        scene.add(dir);

        loader.load('assets/scene.gltf', (gltf) => {
          const model = gltf.scene.clone();
          const box = new Box3().setFromObject(model);
          const center = box.getCenter(new Vector3());
          const size = box.getSize(new Vector3());
          model.position.sub(center);
          model.scale.setScalar(1.8 / Math.max(size.x, size.y, size.z));
          scene.add(model);

          gsap.to(model.rotation, { y: Math.PI * 2, duration: 8, repeat: -1, ease: 'none' });
        });

        renderer.setAnimationLoop(() => renderer.render(scene, camera));
      });
    }

    initCarModel();

    async function initSteeringWheel() {
      const canvases = document.querySelectorAll('.wheel-canvas-3d');
      if (!canvases.length) return;

      const { WebGLRenderer, Scene, PerspectiveCamera, AmbientLight, DirectionalLight, Box3, Vector3 } = await import('three');
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');

      const loader = new GLTFLoader();

      canvases.forEach((canvas) => {
        const renderer = new WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(38, 38);

        const scene = new Scene();
        const camera = new PerspectiveCamera(45, 1, 0.1, 100);
        camera.position.set(0, 0, 3);
        camera.lookAt(0, 0, 0);

        scene.add(new AmbientLight(0xffffff, 1.2));
        const dir = new DirectionalLight(0xffffff, 1.5);
        dir.position.set(3, 5, 3);
        scene.add(dir);

        loader.load('assets/steering_wheel/scene.gltf', (gltf) => {
          const model = gltf.scene.clone();
          const box = new Box3().setFromObject(model);
          const center = box.getCenter(new Vector3());
          const size = box.getSize(new Vector3());
          model.position.sub(center);
          model.scale.setScalar(1.8 / Math.max(size.x, size.y, size.z));
          scene.add(model);

          gsap.to(model.rotation, { z: -Math.PI * 2, duration: 6, repeat: -1, ease: 'none' });
        });

        renderer.setAnimationLoop(() => renderer.render(scene, camera));
      });
    }

    initSteeringWheel();

    function initContrast() {
      const btn = document.getElementById('contrast-btn');

      function applyContrast(active) {
        document.body.classList.toggle('high-contrast', active);
        btn.setAttribute('aria-pressed', String(active));
        btn.setAttribute('aria-label', active ? 'Desativar alto contraste' : 'Ativar alto contraste');
        btn.innerHTML = active
          ? '<i data-lucide="moon" width="20" height="20" aria-hidden="true"></i>'
          : '<i data-lucide="sun" width="20" height="20" aria-hidden="true"></i>';
        lucide.createIcons();
      }

      btn.addEventListener('click', () => {
        const next = !document.body.classList.contains('high-contrast');
        localStorage.setItem('highContrast', String(next));
        applyContrast(next);
      });

      applyContrast(localStorage.getItem('highContrast') === 'true');
    }

    initContrast();

    function initFontSize() {
      const STEP  = 0.1;  
      const MIN   = 0.8;  
      const MAX   = 1.4;  

      const btnIncrease = document.getElementById('font-increase');
      const btnDecrease = document.getElementById('font-decrease');

      let scale = parseFloat(localStorage.getItem('fontScale')) || 1;

      function applyScale(value) {
        scale = Math.min(MAX, Math.max(MIN, value));
        document.documentElement.style.setProperty('--font-scale', scale);
        localStorage.setItem('fontScale', scale);
        btnDecrease.disabled = scale <= MIN;
        btnIncrease.disabled = scale >= MAX;
      }

      btnIncrease.addEventListener('click', () => applyScale(scale + STEP));
      btnDecrease.addEventListener('click', () => applyScale(scale - STEP));

      applyScale(scale);
    }

    initFontSize();

    document.addEventListener('keydown', (e) => {
      const el = document.activeElement;
      if ((e.key === 'Enter' || e.key === ' ') && el.matches('[role="button"], [tabindex="0"]')) {
        e.preventDefault();
        el.click();
      }
    });
  </script>
</body>
</html>
